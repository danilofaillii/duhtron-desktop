<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>DuhTron</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EEF1FA;color:#1C1A4A;font-family:system-ui,sans-serif;text-align:center}
  .box{max-width:420px;padding:32px}
  h1{font-size:26px;margin:0 0 10px}
  p{margin:0 0 24px;line-height:1.5}
  button{font-size:17px;font-weight:700;padding:12px 28px;border:2px solid #1C1A4A;border-radius:999px;background:#FFE347;color:#1C1A4A;cursor:pointer;box-shadow:4px 4px 0 #1C1A4A}
  button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #1C1A4A}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:64px">💡</div>
  <h1>Niente internet. Nemmeno io ci arrivo.</h1>
  <p>DuhTron abita online: controlla la connessione e riprova. Nel frattempo ho già dimenticato la tua domanda.</p>
  <button onclick="location.href='https://duhtron.com/?app=desktop'">Riprova</button>
</div>
</body>
</html>
