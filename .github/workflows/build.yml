name: Costruisci gli installer

# Parte quando spingi un tag di versione (v1.0.0, v1.0.1…)
# e pubblica gli installer nella pagina Releases del repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Niente firma: su Mac e Windows comparirà l'avviso "autore sconosciuto"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
